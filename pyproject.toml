[build-system]
requires = ["setuptools >= 18.0", "Cython >= 3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vice"
version = "1.3.2"
requires-python = ">=3.10"
readme = "README.rst"
authors = [{name = "James W. Johnson", email = "giganano9@gmail.com"}]
maintainers = [{name = "James W. Johnson", email = "giganano9@gmail.com"}]
license-files = ["LICENSE"]
description = "Galactic chemical evolution integrator"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Science/Research",
	"Natural Language :: English",
	"Operating System :: MacOS",
	"Operating System :: POSIX",
	"Operating System :: Unix",
	"Programming Language :: C",
	"Programming Language :: Cython",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
dill = ["dill >= 0.2.0"]
docs = ["sphinx >= 6.0"]

[project.urls]
homepage = "https://pypi.org/project/vice"
download = "https://pypi.org/project/vice/#files"
repository = "https://github.com/giganano/VICE.git"
issues = "https://github.com/giganano/VICE/issues"
documentation = "https://vice-astro.readthedocs.io/"

[tool.setuptools]
py-modules = [] # ignores additional directories in root directory

